name: Deploy to EC2

on:
  push:
    branches:
      - dev  # Add other branches if needed
      - aws_poc  # Add other branches if needed

jobs: 
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 
 
      - name: Set Up SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Run Unit Tests
        run: |
          BRANCH_NAME=$(echo ${GITHUB_REF##*/})
          echo "Running Unit Tests on branch: $BRANCH_NAME"

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            #cd /web_branch/branches/unitests/ && php runUnitTests.php ${BRANCH_NAME} #important          
          EOF

      - name: Create Build and upload artifact to S3  
        run: |
          BRANCH_NAME=$(echo ${GITHUB_REF##*/})
          echo "Creating Build and uploading artifact to S3: $BRANCH_NAME"

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            #rm -rf /web_branch/branches/code/* #deleting current releases to save space on EC2, need to remove it  #important
            #cd /home/ec2-user/deployer && dep deploy --branch=${BRANCH_NAME} #important
            #cd /web_branch/branches/aws_poc && tar --zstd -cf /web_branch/archives/${BRANCH_NAME}.tar.zst ./. #important
            
            #copy file to s3
            #aws s3 cp /web_branch/archives/${BRANCH_NAME}.tar.zst s3://csm-access-github-actions-poc-builds/dev/ #important
            
            # sudo chown -R ${{ secrets.EC2_USER }}:$(whoami) /var/www/html/${BRANCH_NAME} 
          EOF

        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-2  # Change to your AWS region

      - name: Get ASG Instance IDs
        id: get-instances
        run: |
          # Retrieve instance IDs and convert to array
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names csm-saccess-dev-asg \
            --query 'AutoScalingGroups[0].Instances[*].InstanceId' \
            --output text)
          
          # Check if any instances were found
          if [ -z "$INSTANCE_IDS" ]; then
            echo "No instances found in the Auto Scaling Group"
            exit 1
          fi
          
          echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT

      - name: Run SSM Command and Capture Output
        id: run-command
        run: |
          # Run SSM command and capture the command ID
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --document-version "1" \
            --targets "Key=InstanceIds,Values=${{ steps.get-instances.outputs.instance_ids }}" \
            --parameters '{"commands":["sudo su - ec2-user -c \"mkdir -p /web_branch/hihi\""]}' \
            --timeout-seconds 600 \
            --max-concurrency "50%" \
            --max-errors "0" \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)
          
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait and Retrieve Command Output
        run: |
          # Wait for command to complete
          aws ssm wait command-executed \
            --command-id ${{ steps.run-command.outputs.command_id }} \
            --instance-ids ${{ steps.get-instances.outputs.instance_ids }}
          
          # Retrieve command output for each instance
          for INSTANCE_ID in $(echo "${{ steps.get-instances.outputs.instance_ids }}" | tr ' ' '\n'); do
            echo "==== Output for Instance $INSTANCE_ID ===="
            
            # Retrieve command invocation details
            aws ssm get-command-invocation \
              --command-id ${{ steps.run-command.outputs.command_id }} \
              --instance-id "$INSTANCE_ID" \
              --query '{Status: Status, StdOut: StandardOutputContent, StdErr: StandardErrorContent}' \
              --output json
          done
      
