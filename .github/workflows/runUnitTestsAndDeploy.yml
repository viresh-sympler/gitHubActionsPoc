name: Run Unit Tests, Create Build and Deploy Application to Web Servers

on:
  push:
    branches:
      - dev  # Add other branches if needed
      - aws_poc  # Add other branches if needed
      - '**/*dev*/**'  # Matches path-like branch names containing "dev"
  pull_request:
    types: [closed]    # This catches merge events
    branches:
      - '**/*dev*/**'  # Matches path-like branch names containing "dev"

jobs: 
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:        
      - name: Checkout Repository
        uses: actions/checkout@v4 
 
      - name: Set Up SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Run Unit Tests
        run: |
          BRANCH_NAME=$(echo ${GITHUB_REF##*/})
          echo "Running Unit Tests on branch: $BRANCH_NAME"

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            php ${{ vars.UNIT_TESTS_PATH }} ${BRANCH_NAME} #important          
          EOF

      - name: Create Build and upload artifacts to S3  
        run: |
          BRANCH_NAME=$(echo ${GITHUB_REF##*/})
          echo "Creating Build and uploading artifact to S3: $BRANCH_NAME"

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            #rm -rf /web_branch/branches/code/* #deleting current releases to save space on EC2, need to remove it  #important
            cd /home/ec2-user/deployer && dep deploy --branch=${BRANCH_NAME} #important
            cd ${{ vars.BRANCH_PATH }}${BRANCH_NAME} && tar --zstd -cf ${{vars.BRANCH_ARCHIVES_PATH}}${BRANCH_NAME}.tar.zst ./. #important
            
            #copy file to s3
            aws s3 cp ${{vars.BRANCH_ARCHIVES_PATH}}${BRANCH_NAME}.tar.zst ${{ vars.S3_BUILD_PATH }} #important
            
          EOF
          
      - name: Deploy branch to Web Servers
        run: |
          BRANCH_NAME=$(echo ${GITHUB_REF##*/})
          echo "Deploying branch: $BRANCH_NAME to all web servers"

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            php /home/ec2-user/deployer/deploy_to_web_servers/deployToAsg.php --region=${{vars.AWS_REGION}} --asg=${{vars.AWS_ASG_NAME}} --branch=${BRANCH_NAME}
          EOF
